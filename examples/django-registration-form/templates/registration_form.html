<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiss User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .autocomplete-dropdown {
            position: absolute;
            background: white;
            border: 1px solid #ddd;
            border-top: none;
            max-height: 200px;
            overflow-y: auto;
            width: 100%;
            z-index: 1000;
        }
        .autocomplete-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .autocomplete-item:hover {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2>Register (Swiss Address)</h2>
                <form method="post" id="registrationForm">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_email">Email</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label for="id_first_name">First Name</label>
                        {{ form.first_name }}
                    </div>

                    <div class="mb-3">
                        <label for="id_last_name">Last Name</label>
                        {{ form.last_name }}
                    </div>

                    <div class="mb-3">
                        <label for="id_address">Address (Swiss)</label>
                        <div style="position: relative;">
                            {{ form.address }}
                            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_postal_code">Postal Code</label>
                        {{ form.postal_code }}
                    </div>

                    <div class="mb-3">
                        <label for="id_city">City</label>
                        {{ form.city }}
                    </div>

                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const addressInput = $('[data-toggle="autocomplete"]');
            const dropdown = $('#autocompleteDropdown');
            let debounceTimer;

            addressInput.on('input', function() {
                clearTimeout(debounceTimer);
                const query = $(this).val();

                if (query.length < 3) {
                    dropdown.empty();
                    return;
                }

                debounceTimer = setTimeout(() => {
                    $.get('/api/ch-address/autocomplete/', { q: query }, function(data) {
                        dropdown.empty();
                        if (data.results && data.results.length > 0) {
                            data.results.forEach(result => {
                                const item = $('<div class="autocomplete-item"></div>')
                                    .text(result.label)
                                    .on('click', function() {
                                        addressInput.val(result.label);
                                        $('#id_postal_code').val(result.postal_code);
                                        $('#id_city').val(result.city);
                                        dropdown.empty();
                                    });
                                dropdown.append(item);
                            });
                        }
                    });
                }, 300);
            });

            // Close dropdown when clicking outside
            $(document).on('click', function(e) {
                if (!$(e.target).closest('.mb-3').length) {
                    dropdown.empty();
                }
            });
        });
    </script>
</body>
</html>

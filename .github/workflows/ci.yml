name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Code formatting (ruff format)
  # ──────────────────────────────────────────────────────────────────────────
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Check formatting
        run: uv run ruff format --check .

  # ──────────────────────────────────────────────────────────────────────────
  # Linting (ruff check incl. docstring D-rules + pylint ≥ 8.5)
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint (includes docstring D-rules)
        run: uv run ruff check .

      - name: Pylint (score ≥ 8.5)
        run: uv run pylint postal_address --fail-under=8.5

  # ──────────────────────────────────────────────────────────────────────────
  # Static type checking (mypy)
  # ──────────────────────────────────────────────────────────────────────────
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: mypy
        run: uv run mypy postal_address

  # ──────────────────────────────────────────────────────────────────────────
  # Spell checker (codespell)
  # ──────────────────────────────────────────────────────────────────────────
  spell-check:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: codespell
        run: uv run codespell .

  # ──────────────────────────────────────────────────────────────────────────
  # Tests – matrix across Python 3.12 / 3.13 / 3.14
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (Python ${{ matrix.python-version }})
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

  # ──────────────────────────────────────────────────────────────────────────
  # Coverage report → Coveralls (runs after all tests pass)
  # ──────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [format, lint, type-check, spell-check, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest --cov=postal_address --cov-report=lcov --cov-report=term-missing

      - name: Upload coverage to Coveralls
        run: uv run coveralls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

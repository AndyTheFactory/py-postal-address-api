[project]
name = "postal-address-api"
version = "0.1.0"
description = "Country-aware Python client for AddressPerfect on RapidAPI. Offering postal code and street search, address normalization, and country-specific formatting. Lightweight, requests-based, and easy to integrate into applications and services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "pylint>=3.0.0",
  "mypy>=1.10.0",
  "codespell>=2.3.0",
  "coveralls>=4.0.0",
  "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["postal_address"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "D",   # pydocstyle
]
ignore = [
  "D100", # Missing docstring in public module  (covered by codespell/manual review)
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in __init__ (args are documented on the class in Google style)
  "D203", # one-blank-line-before-class (conflicts with D211)
  "D213", # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]  # test files don't require docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false

[tool.pylint.main]
fail-under = 8.5

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
]

[tool.codespell]
skip = "uv.lock,*.egg-info"
ignore-words-list = "hnr"
